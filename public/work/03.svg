<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="spatialBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="spatialGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="24" fill="#0f0f11"/>
  <g transform="translate(100, 60)" filter="url(#spatialGlow)">
    <rect width="600" height="380" rx="36" fill="url(#spatialBg)" stroke="#312e81" stroke-width="1.5"/>
    
    <!-- 3D Spatial Canvas Wireframe / Isometric cards -->
    <g transform="translate(170, 90)">
      <polygon points="130,30 250,90 130,150 10,90" fill="url(#glassGrad)" stroke="#818cf8" stroke-width="1.5"/>
      <polygon points="130,90 250,150 130,210 10,150" fill="url(#glassGrad)" stroke="#a5b4fc" stroke-width="1.5"/>
      <polygon points="130,150 250,210 130,270 10,210" fill="url(#glassGrad)" stroke="#c7d2fe" stroke-width="1.5"/>
      <circle cx="130" cy="90" r="8" fill="#38bdf8"/>
      <circle cx="200" cy="125" r="5" fill="#818cf8"/>
      <circle cx="60" cy="125" r="5" fill="#f43f5e"/>
    </g>
    <text x="300" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="700" fill="#e0e7ff" letter-spacing="2">SPATIAL CANVAS</text>
  </g>
</svg>
